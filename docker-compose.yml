# Only service that publishes a port; the API is reached as wtw-api inside wtw-network.
services:
  wtw:
    build:
      context: .
      target: prod
    image: wtw
    container_name: wtw
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      # Set these in .env or in the host (Coolify); see .env.example and the README.
      # API_URL: http://wtw-api:3000
      # COOKIE_SECURE: 'true'
      # NG_ALLOWED_HOSTS: wtw.example.com
      # INTERNAL_ORIGIN: http://localhost:4000
      # SSR_API_TIMEOUT_MS: 3000
    ports:
      - '4000:4000'
    networks:
      - wtw-network

networks:
  wtw-network:
    external: true
