<mat-sidenav-container class="shell">
<mat-sidenav
  mode="over"
  position="end"
  class="panel"
  [opened]="panelOpen()"
  (closedStart)="panelOpen.set(false)"
>
  @defer (when panelOpen()) {
  <app-user-panel (closed)="panelOpen.set(false)"></app-user-panel>
  }
</mat-sidenav>
<mat-sidenav-content>

<header class="header">
  <h1>What to Watch?</h1>
  <button
    mat-icon-button
    class="user-menu"
    aria-label="Open your panel"
    (click)="panelOpen.set(true)"
  >
    <mat-icon>account_circle</mat-icon>
  </button>
</header>

<div class="container">
  <div class="menu">
    <div class="menu-icon">
      <mat-icon>theater_comedy</mat-icon>
    </div>
    <app-form
      (movieEvent)="recieveMovie($event)"
      (isLoadingEvent)="recieveIsLoading($event)"
      (errorEvent)="recieveError()"
    ></app-form>
  </div>
  <div class="content">
    @if (isLoading()) {
      <div class="spinner-container">
        <mat-spinner></mat-spinner>
      </div>
    } @else if (message(); as message) {
      <div class="message" role="status">
        <mat-icon>movie_filter</mat-icon>
        <p>{{ message }}</p>
      </div>
    } @else {
      <app-movie-card [movie]="movie()"></app-movie-card>
    }
  </div>
</div>
<div class="overview">
  <app-movies-overview></app-movies-overview>
</div>
</mat-sidenav-content>
</mat-sidenav-container>
